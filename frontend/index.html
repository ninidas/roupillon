<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Roupillon</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#191733" />
    <!-- Ambiance choisie sur ce téléphone, posée avant l'affichage pour éviter un éclair de la mauvaise couleur -->
    <script>
      try { if ((JSON.parse(localStorage.getItem('rp_theme')) || 'bleu') === 'bleu') document.documentElement.dataset.theme = 'bleu' }
      catch (e) { document.documentElement.dataset.theme = 'bleu' }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roupillon" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
